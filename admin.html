<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mishor's Shop Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#fff7ed;color:#172033}
.box{max-width:600px;margin:18px auto;padding:20px;background:white;border-radius:16px;box-shadow:0 4px 20px #0001}
h2{color:#ea580c}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;font-size:15px}
input,select{border:1px solid #ddd;background:white}
button{border:0;background:#f97316;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#475569}
.danger{background:#dc2626}
.item{border:1px solid #eee;padding:13px;border-radius:10px;margin-top:12px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.small{font-size:13px;color:#64748b;line-height:1.6}
#panel{display:none}
#message,#productMessage{overflow-wrap:anywhere;line-height:1.6}
.preview{width:100%;max-width:220px;max-height:220px;object-fit:contain;border:1px solid #ddd;border-radius:10px;display:none;margin:10px 0}
.product-thumb{width:100px;height:100px;object-fit:contain;border:1px solid #eee;border-radius:8px;display:block;margin:8px 0}
</style>
</head>
<body>

<section class="box">
<h2>🛍️ Mishor's Shop</h2>
<h3>Admin Login</h3>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">লগইন</button>
</form>
<p id="message" role="status"></p>
<button id="logout" class="secondary" hidden>লগআউট</button>
</section>

<section class="box" id="panel">
<h2>📦 পণ্য পরিচালনা</h2>
<h3 id="formTitle">নতুন পণ্য যোগ করুন</h3>

<form id="productForm">
<label for="name">পণ্যের নাম</label>
<input id="name" placeholder="যেমন: Stylish Watch" maxlength="100" required>

<label for="price">দাম (টাকা)</label>
<input id="price" type="number" placeholder="পণ্যের দাম" min="1" max="10000000" step="1" required>

<label for="category">ক্যাটাগরি</label>
<select id="category" required>
<option value="Fashion">Fashion</option>
<option value="Sports">Sports</option>
<option value="Electronics">Electronics</option>
<option value="Gift">Gift</option>
<option value="Necessary Products">Necessary Products</option>
<option value="Shoes">Shoes</option>
<option value="Beauty & Personal Care">Beauty & Personal Care</option>
<option value="Home & Living">Home & Living</option>
</select>

<label for="photo"><strong>🖼️ গ্যালারি থেকে পণ্যের ছবি</strong></label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
<p class="small">JPG, PNG বা WebP। সর্বোচ্চ 5 MB।</p>
<img id="preview" class="preview" alt="পণ্যের ছবির প্রিভিউ">

<label for="image">অথবা ছবির HTTPS লিংক</label>
<input id="image" type="url" placeholder="https://... (ঐচ্ছিক)">

<label for="emoji">ইমোজি (ঐচ্ছিক)</label>
<input id="emoji" placeholder="যেমন 🎒" maxlength="10">

<button id="saveButton" type="submit">পণ্য Firebase-এ যোগ করুন</button>
<button id="cancelEdit" class="secondary" type="button" hidden>সম্পাদনা বাতিল</button>
</form>

<p id="productMessage" role="status"></p>
<h3>সংরক্ষিত পণ্য</h3>
<div id="productList">পণ্য লোড হচ্ছে...</div>
<p class="small">পণ্য মুছে ফেলার আগে নিশ্চিত হও। মুছে ফেলা পণ্য ফিরিয়ে আনা নাও যেতে পারে।</p>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
 getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {
 getFirestore, collection, addDoc, getDocs, query, orderBy,
 serverTimestamp, updateDoc, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
import {
 getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-storage.js";

const firebaseConfig = {
 apiKey: "AIzaSyCxxTa5mxcaErL_bGO6FxboZNJA1t_B0UE",
 authDomain: "mishors-shop-admin.firebaseapp.com",
 projectId: "mishors-shop-admin",
 storageBucket: "mishors-shop-admin.firebasestorage.app",
 messagingSenderId: "828816512879",
 appId: "1:828816512879:web:3e297717db9b391f09fa9a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const adminUID = "A2kBB273NcSzQ2naJF2PBrue47k2";

const categories = [
 "Fashion",
 "Sports",
 "Electronics",
 "Gift",
 "Necessary Products",
 "Shoes",
 "Beauty & Personal Care",
 "Home & Living"
];

const categoryAliases = {
 "ফ্যাশন":"Fashion",
 "ইলেকট্রনিক্স":"Electronics",
 "জুতা":"Shoes",
 "উপহার":"Gift",
 "fashion":"Fashion",
 "sports":"Sports",
 "electronics":"Electronics",
 "gift":"Gift",
 "necessary products":"Necessary Products",
 "shoes":"Shoes",
 "beauty & personal care":"Beauty & Personal Care",
 "home & living":"Home & Living"
};

function normalizeCategory(value){
 const text = String(value || "").trim();
 return categoryAliases[text] ||
 categoryAliases[text.toLowerCase()] ||
 (categories.includes(text) ? text : "Fashion");
}

const $ = id => document.getElementById(id);
const loginForm = $("loginForm");
const productForm = $("productForm");
const panel = $("panel");
const message = $("message");
const productMessage = $("productMessage");
const productList = $("productList");
const photoInput = $("photo");
const preview = $("preview");

let editingId = null;
let busy = false;
let oldImageUrl = "";
let previewObjectUrl = "";

function isAdmin(){
 return !!auth.currentUser && auth.currentUser.uid === adminUID;
}

function setBusy(value){
 busy = value;
 $("saveButton").disabled = value;
 $("logout").disabled = value;
}

function showPreview(url){
 if(previewObjectUrl){
  URL.revokeObjectURL(previewObjectUrl);
  previewObjectUrl = "";
 }
 if(url){
  preview.src = url;
  preview.style.display = "block";
 }else{
  preview.removeAttribute("src");
  preview.style.display = "none";
 }
}

photoInput.addEventListener("change", () => {
 const file = photoInput.files[0];
 if(!file) return;

 if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
  photoInput.value = "";
  productMessage.textContent = "JPG, PNG অথবা WebP ছবি বেছে নাও।";
  return;
 }

 if(file.size > 5 * 1024 * 1024){
  photoInput.value = "";
  productMessage.textContent = "ছবির সাইজ 5 MB-এর কম হতে হবে।";
  return;
 }

 if(previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
 previewObjectUrl = URL.createObjectURL(file);
 preview.src = previewObjectUrl;
 preview.style.display = "block";
 $("image").value = "";
 productMessage.textContent = "ছবি নির্বাচন করা হয়েছে।";
});

loginForm.addEventListener("submit", async event => {
 event.preventDefault();
 message.textContent = "লগইন হচ্ছে...";

 try{
  const result = await signInWithEmailAndPassword(
   auth, $("email").value.trim(), $("password").value
  );

  if(result.user.uid !== adminUID){
   await signOut(auth);
   message.textContent = "এই অ্যাকাউন্ট Admin নয়।";
   return;
  }
  message.textContent = "লগইন সফল!";
 }catch(error){
  console.error(error);
  message.textContent = "লগইন হয়নি। ইমেইল, পাসওয়ার্ড ও Firebase সেটিংস পরীক্ষা করো।";
 }
});

onAuthStateChanged(auth, async user => {
 const allowed = !!user && user.uid === adminUID;
 panel.style.display = allowed ? "block" : "none";
 loginForm.style.display = allowed ? "none" : "block";
 $("logout").hidden = !allowed;

 if(user && !allowed){
  await signOut(auth);
  message.textContent = "এই অ্যাকাউন্টের Admin অনুমতি নেই।";
 }
 if(allowed) await loadProducts();
});

$("logout").addEventListener("click", async () => {
 await signOut(auth);
 message.textContent = "লগআউট হয়েছে।";
});

function resetForm(){
 editingId = null;
 oldImageUrl = "";
 productForm.reset();
 showPreview("");
 $("formTitle").textContent = "নতুন পণ্য যোগ করুন";
 $("saveButton").textContent = "পণ্য Firebase-এ যোগ করুন";
 $("cancelEdit").hidden = true;
}

$("cancelEdit").addEventListener("click", () => {
 resetForm();
 productMessage.textContent = "সম্পাদনা বাতিল হয়েছে।";
});

function readForm(){
 const name = $("name").value.trim();
 const price = Number($("price").value);
 const category = $("category").value;
 const emoji = $("emoji").value.trim();
 const image = $("image").value.trim();
 const file = photoInput.files[0];

 if(!name || name.length > 100) throw new Error("পণ্যের নাম ঠিকভাবে লিখো।");
 if(!Number.isSafeInteger(price) || price < 1 || price > 10000000){
  throw new Error("দাম ১ থেকে ১ কোটি টাকার মধ্যে পূর্ণ সংখ্যা হতে হবে।");
 }
 if(!categories.includes(category)) throw new Error("সঠিক ক্যাটাগরি বেছে নাও।");

 if(image){
  let url;
  try{ url = new URL(image); }
  catch{ throw new Error("ছবির লিংক সঠিক নয়।"); }
  if(url.protocol !== "https:") throw new Error("ছবির লিংক https:// দিয়ে শুরু হতে হবে।");
 }

 if(file){
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
   throw new Error("JPG, PNG অথবা WebP ছবি বেছে নাও।");
  }
  if(file.size > 5 * 1024 * 1024) throw new Error("ছবির সাইজ 5 MB-এর কম হতে হবে।");
 }

 return {name,price,category,emoji,image,file};
}

async function uploadProductImage(file){
 const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const imageRef = ref(storage,"product-images/"+Date.now()+"_"+safeName);
 await uploadBytes(imageRef,file,{contentType:file.type});
 return await getDownloadURL(imageRef);
}

productForm.addEventListener("submit", async event => {
 event.preventDefault();
 if(busy) return;

 if(!isAdmin()){
  productMessage.textContent = "আগে Admin হিসেবে লগইন করো।";
  return;
 }

 let data;
 try{ data = readForm(); }
 catch(error){
  productMessage.textContent = error.message;
  return;
 }

 setBusy(true);
 productMessage.textContent = "পণ্য সংরক্ষণ হচ্ছে...";

 try{
  let imageUrl = data.image || oldImageUrl;
  if(data.file){
   productMessage.textContent = "ছবি Firebase Storage-এ আপলোড হচ্ছে...";
   imageUrl = await uploadProductImage(data.file);
  }

  const productData = {
   name:data.name,
   price:data.price,
   category:data.category,
   emoji:data.emoji,
   image:imageUrl || "",
   updatedAt:serverTimestamp()
  };

  if(editingId){
   await updateDoc(doc(db,"products",editingId),productData);
   productMessage.textContent = "পণ্য আপডেট হয়েছে!";
  }else{
   await addDoc(collection(db,"products"),{
    ...productData,
    createdAt:serverTimestamp()
   });
   productMessage.textContent = "নতুন পণ্য Firebase-এ সংরক্ষিত হয়েছে!";
  }

  resetForm();
  await loadProducts();
 }catch(error){
  console.error(error);
  if(error.code === "storage/unauthorized"){
   productMessage.textContent = "ছবি আপলোডের অনুমতি নেই। Firebase Storage Rules পরীক্ষা করতে হবে।";
  }else if(error.code === "storage/bucket-not-found"){
   productMessage.textContent = "Firebase Storage চালু আছে কি না এবং bucket ঠিক কি না পরীক্ষা করো।";
  }else{
   productMessage.textContent = "কাজটি হয়নি। ইন্টারনেট, Firebase Storage এবং Firestore Rules পরীক্ষা করো।";
  }
 }finally{
  setBusy(false);
 }
});

async function loadProducts(){
 if(!isAdmin()) return;
 productList.textContent = "পণ্য লোড হচ্ছে...";

 try{
  const result = await getDocs(query(collection(db,"products"),orderBy("createdAt","desc")));
  productList.replaceChildren();

  if(result.empty){
   productList.textContent = "এখনো কোনো পণ্য যোগ করা হয়নি।";
   return;
  }

  result.forEach(docSnap => {
   const p = docSnap.data();
   const item = document.createElement("div");
   item.className = "item";

   if(p.image){
    const img = document.createElement("img");
    img.className = "product-thumb";
    img.src = p.image;
    img.alt = p.name || "পণ্যের ছবি";
    img.loading = "lazy";
    item.append(img);
   }

   const title = document.createElement("strong");
   title.textContent = (p.emoji ? p.emoji+" " : "") + (p.name || "নামহীন পণ্য");

   const details = document.createElement("p");
   details.textContent = "৳"+p.price+" • "+normalizeCategory(p.category);
   item.append(title,details);

   const actions = document.createElement("div");
   actions.className = "actions";

   const editButton = document.createElement("button");
   editButton.textContent = "✏️ সম্পাদনা";
   editButton.addEventListener("click",()=>startEdit(docSnap.id,p));

   const deleteButton = document.createElement("button");
   deleteButton.textContent = "🗑️ মুছুন";
   deleteButton.className = "danger";
   deleteButton.addEventListener("click",()=>removeProduct(docSnap.id,p.name));

   actions.append(editButton,deleteButton);
   item.append(actions);
   productList.append(item);
  });
 }catch(error){
  console.error(error);
  productList.textContent = "পণ্য লোড হয়নি। ইন্টারনেট ও Firebase Rules পরীক্ষা করো।";
 }
}

function startEdit(id,p){
 if(!isAdmin()) return;

 editingId = id;
 oldImageUrl = p.image || "";

 $("name").value = p.name || "";
 $("price").value = p.price ?? "";
 $("category").value = normalizeCategory(p.category);
 $("emoji").value = p.emoji || "";
 $("image").value = p.image || "";
 photoInput.value = "";
 showPreview(p.image || "");

 $("formTitle").textContent = "পণ্য সম্পাদনা করো";
 $("saveButton").textContent = "পরিবর্তন সংরক্ষণ করুন";
 $("cancelEdit").hidden = false;
 productMessage.textContent = "নতুন ছবি বেছে নিলে সেটি পুরোনো ছবির বদলে ব্যবহার হবে।";
 $("formTitle").scrollIntoView({behavior:"smooth",block:"center"});
}

async function removeProduct(id,name){
 if(!isAdmin() || busy) return;

 if(!confirm("তুমি কি সত্যিই “"+(name || "এই পণ্য")+"” মুছে ফেলতে চাও?\n\nএই কাজ ফিরিয়ে আনা যাবে না।")) return;

 setBusy(true);
 productMessage.textContent = "পণ্য মুছে ফেলা হচ্ছে...";

 try{
  await deleteDoc(doc(db,"products",id));
  if(editingId === id) resetForm();
  productMessage.textContent = "পণ্য মুছে ফেলা হয়েছে।";
  await loadProducts();
 }catch(error){
  console.error(error);
  productMessage.textContent = "পণ্য মুছে ফেলা যায়নি। Firebase Rules ও ইন্টারনেট পরীক্ষা করো।";
 }finally{
  setBusy(false);
 }
}
</script>
</body>
</html>
