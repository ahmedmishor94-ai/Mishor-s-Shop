<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seller Membership | Mishor's Shop</title>
<style>
body{font-family:Arial,sans-serif;background:#fff7ed;margin:0;padding:18px;color:#222}
.card{max-width:460px;margin:20px auto;background:white;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0001}
h2{color:#ea580c}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#ea580c;color:white;border:0;font-weight:bold}
button:disabled{opacity:.5}
#status{white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<h2>🛍️ Seller Membership</h2>
<p>বার্ষিক সদস্য ফি: <b>৳১০০</b></p>
<p>Admin-এর Nagad নম্বরে ৳১০০ পাঠাও।</p>

<h3 style="color:#ea580c;text-align:center">
  Nagad: 01747036594
</h3>

<p>টাকা পাঠানোর পর Transaction ID জমা দাও। Admin যাচাই করে সদস্যপদ চালু বা নবায়ন করবেন।</p>
<form id="loginForm">
<h3>অ্যাকাউন্টে লগইন</h3>
<input id="email" type="email" placeholder="ইমেইল" required>
<input id="password" type="password" placeholder="পাসওয়ার্ড" required>
<button>লগইন</button>
</form>

<div id="paymentBox" hidden>
<p id="accountInfo"></p>
<p id="membershipInfo"></p>
<form id="feeForm">
<label>যে নম্বর থেকে টাকা পাঠিয়েছো</label>
<input id="senderPhone" type="tel" placeholder="01XXXXXXXXX" required>
<label>Nagad Transaction ID</label>
<input id="trx" maxlength="120" placeholder="Transaction ID" required>
<button id="submitBtn">পেমেন্ট প্রমাণ জমা দাও</button>
</form>
</div>

<p id="status">লোড হচ্ছে...</p>
<p><a href="seller-dashboard.html">Seller Dashboard</a></p>
<p><a href="index.html">দোকানে ফিরে যাও</a></p>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,addDoc,query,where,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCxxTa5mxcaErL_bGO6FxboZNJA1t_B0UE",
authDomain:"mishors-shop-admin.firebaseapp.com",
projectId:"mishors-shop-admin",
storageBucket:"mishors-shop-admin.firebasestorage.app",
messagingSenderId:"828816512879",
appId:"1:828816512879:web:3e297717db9b391f09fa9a"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
let currentUser=null;
let canPay=false;

function say(t){$("status").textContent=t;}

onAuthStateChanged(auth,async user=>{
currentUser=user;
$("loginForm").hidden=!!user;
$("paymentBox").hidden=!user;
canPay=false;

if(!user){say("পেমেন্ট জমা দিতে আগে লগইন করো।");return;}

$("accountInfo").textContent="লগইন: "+(user.email||user.uid);
$("submitBtn").disabled=true;

try{
const snap=await getDoc(doc(db,"users",user.uid));
if(!snap.exists())throw new Error("PROFILE_MISSING");

const profile=snap.data();
const expiry=profile.membershipExpiresAt?.toDate?.();
const active=profile.sellerStatus==="approved" && expiry && expiry>new Date();

if(active){
$("membershipInfo").textContent="বর্তমান সদস্যপদ চালু। মেয়াদ শেষ: "+expiry.toLocaleDateString("bn-BD")+"। এখন নবায়নের আবেদন করতে পারো।";
}else{
$("membershipInfo").textContent="সদস্যপদ চালু করতে বা মেয়াদোত্তীর্ণ সদস্যপদ নবায়ন করতে ৳১০০ জমা দাও।";
}

const pending=await getDocs(query(
collection(db,"sellerPayments"),
where("uid","==",user.uid),
where("status","==","pending")
));

if(!pending.empty){
say("তোমার একটি পেমেন্ট আবেদন যাচাইয়ের অপেক্ষায় আছে। নতুন আবেদন করার আগে Admin-এর সিদ্ধান্তের জন্য অপেক্ষা করো।");
return;
}

canPay=true;
$("submitBtn").disabled=false;
say("Transaction ID ও প্রেরকের নম্বর দিয়ে আবেদন জমা দিতে পারো।");

}catch(e){
console.error(e);
say("অ্যাকাউন্ট যাচাই হয়নি। users প্রোফাইল ও Firestore Rules পরীক্ষা করো।");
}
});

$("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
say("লগইন হচ্ছে...");
try{
await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
}catch(err){
console.error(err);
say("লগইন হয়নি। ইমেইল ও পাসওয়ার্ড পরীক্ষা করো।");
}
});

$("feeForm").addEventListener("submit",async e=>{
e.preventDefault();
if(!currentUser||!canPay)return;

const trx=$("trx").value.trim();
const phone=$("senderPhone").value.trim();

if(!trx||!/^01[3-9]\d{8}$/.test(phone)){
say("সঠিক Transaction ID ও ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দাও।");
return;
}

$("submitBtn").disabled=true;
say("আবেদন জমা হচ্ছে...");

try{
const profileSnap=await getDoc(doc(db,"users",currentUser.uid));
if(!profileSnap.exists())throw new Error("PROFILE_MISSING");

const pending=await getDocs(query(
collection(db,"sellerPayments"),
where("uid","==",currentUser.uid),
where("status","==","pending")
));
if(!pending.empty)throw new Error("PENDING_EXISTS");

await addDoc(collection(db,"sellerPayments"),{
uid:currentUser.uid,
feeAmount:100,
transactionId:trx,
senderPhone:phone,
paymentMethod:"Nagad",
type:profileSnap.data().sellerStatus==="approved"?"renewal":"new",
status:"pending",
createdAt:serverTimestamp()
});

canPay=false;
$("feeForm").reset();
say("আবেদন জমা হয়েছে। Admin পেমেন্ট যাচাই করে সদস্যপদ চালু বা নবায়ন করবেন।");
}catch(err){
console.error(err);
say("আবেদন জমা হয়নি। Firestore Rules ও ইন্টারনেট পরীক্ষা করো।");
$("submitBtn").disabled=false;
}
});
</script>
</body>
</html>
